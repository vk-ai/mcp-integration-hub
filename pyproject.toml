[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-integration-hub"
version = "0.1.0"
description = "MCP server + A2A agent card for SaaS connectors (GitHub, Slack, HubSpot) with OAuth2/OIDC + PKCE, webhooks, workflows, Vault credentials, RBAC and an audit log."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
vault = ["hvac>=2.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "pytest-bdd>=7", "hvac>=2.1"]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_hub = ["config/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
markers = ["vault: needs a real Vault dev server (set VAULT_ADDR and VAULT_TOKEN)"]
