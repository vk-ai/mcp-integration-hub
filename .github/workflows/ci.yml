name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (fake OAuth/SaaS sandbox, in-memory credentials, no network)
        run: pytest -q --cov=mcp_hub --cov-report=term
      - name: Demo run
        run: python demo/run_demo.py

  vault:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.17
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: --cap-add=IPC_LOCK
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: dev-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Wait for Vault
        run: for i in $(seq 1 30); do curl -fsS "$VAULT_ADDR/v1/sys/health" && break; sleep 1; done
      - name: Vault KV v2 credential store tests
        run: pytest -q -m vault
      - name: Demo with tokens stored in Vault
        run: python demo/run_demo.py
